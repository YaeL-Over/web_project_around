<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Around The U.S." />
    <meta name="author" content="Yael Ramos" />
    <meta
      name="keywords"
      content="diseño web, desarrollo frontend, HTML, CSS, portfolio"
    />

    <title>Around</title>

    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <!-- FORMULARIO EDITAR PERFIL -->
      <section class="popup popup_type_edit popup_edit">
        <div class="popup__container">
          <button
            type="button"
            class="popup__button popup__button_close"
            aria-label="Cerrar modal"
          >
            <img
              src="images/Close_Icon.png"
              alt="icono de cerrar"
              class="popup__icon-close"
            />
          </button>
          <form
            class="popup__form popup__form_type_edit"
            name="Edit"
            novalidate
          >
            <h2 class="popup__title">Editar perfil</h2>
            <fieldset class="popup__content">
              <input
                type="text"
                class="popup__input popup__input_name"
                id="nombre"
                name="nombre"
                placeholder="Nombre"
                minlength="2"
                maxlength="40"
                required
              />
              <span class="popup__error popup__error_nombre"></span>

              <input
                type="text"
                class="popup__input popup__input_about"
                id="acercademi"
                name="acercademi"
                placeholder="Acerca de mi"
                minlength="2"
                maxlength="200"
                required
              />
              <span class="popup__error popup__error_acercademi"></span>
            </fieldset>
            <fieldset class="popup__content">
              <button
                type="submit"
                class="popup__button popup__button_save"
                disabled
              >
                Guardar
              </button>
            </fieldset>
          </form>
        </div>
      </section>

      <!-- FORMULARIO NUEVO LUGAR -->
      <section class="popup popup_type_add popup_add">
        <div class="popup__container">
          <button
            type="button"
            class="popup__button popup__button_close"
            aria-label="Cerrar modal"
          >
            <img
              src="images/Close_Icon.png"
              alt="icono de cerrar"
              class="popup__icon-close"
            />
          </button>
          <form class="popup__form popup__form-add" name="AddCard" novalidate>
            <h2 class="popup__title">Nuevo lugar</h2>
            <fieldset class="popup__content">
              <input
                type="text"
                class="popup__input popup__input_title"
                id="titulo"
                name="titulo"
                placeholder="Titulo"
                minlength="2"
                maxlength="30"
                required
              />
              <span class="popup__error popup__error_titulo"></span>

              <input
                type="url"
                class="popup__input popup__input_link"
                id="link"
                name="link"
                placeholder="Link de la imagen"
                required
              />
              <span class="popup__error popup__error_link"></span>
            </fieldset>
            <fieldset class="popup__content">
              <button
                type="submit"
                class="popup__button popup__button_created"
                disabled
              >
                Crear
              </button>
            </fieldset>
          </form>
        </div>
      </section>

      <!-- MODAL DE IMAGEN AMPLIADA -->
      <div class="popup popup_type_image popup__image-p">
        <div class="popup__container-image">
          <button
            type="button"
            id="button__close3"
            class="popup__button popup__button_close"
            aria-label="Cerrar imagen"
          >
            <img
              src="images/Close_Icon.png"
              alt="icono de cerrar"
              class="popup__icon-close"
            />
          </button>
          <img src="#" alt="" class="popup__image-pic" />
          <p class="popup__image-caption"></p>
        </div>
      </div>

      <!-- HEADER -->
      <header class="header">
        <img
          src="./images/Vector.png"
          class="header__img"
          alt="titulo de la pagina Around The U.S."
        />
      </header>

      <!-- MAIN -->
      <main class="main">
        <section class="main__container">
          <img
            src="./images/AVATAR_Y.png"
            class="main__profile-img"
            alt="avatar del usuario"
          />
          <div class="main__profile-inf">
            <div class="main__profile main__profile_header">
              <h3 class="main__profile-name" id="nombreResult">Yael Ramos</h3>
              <button
                type="button"
                class="popup__button popup__button-main popup__button_edit"
                id="main__profile-btnedit"
                aria-label="Editar perfil"
              >
                <img src="./images/Edit_Button.png" alt="boton de editar" />
              </button>
            </div>

            <h4 class="main__profile-about" id="professionResult">
              Explorador
            </h4>
          </div>
          <button
            type="button"
            class="popup__button popup__button-main main__profile-addbutton"
            id="main__profile-addbutton"
            aria-label="Agregar nueva tarjeta"
          >
            <img src="./images/Add_Button.png" alt="boton de añadir" />
          </button>
        </section>

        <section class="gallery"></section>
      </main>

      <!-- FOOTER -->
      <footer class="footer">
        <h5 class="footer__autor">© 2025 Around The U.S.</h5>
      </footer>
    </div>

    <!-- TEMPLATE DE TARJETA -->
    <template class="template-card">
      <div class="gallery__card">
        <img
          src="#"
          class="gallery__card-img"
          alt="Vista previa del lugar"
          style="cursor: pointer"
        />
        <button
          type="button"
          class="popup__button popup__button_trash"
          aria-label="Eliminar tarjeta"
        >
          <img
            src="./images/Trash.svg"
            alt="icono de eliminar"
            class="gallery__footer-del"
            style="cursor: pointer"
          />
        </button>

        <div class="gallery__footer">
          <h4 class="gallery__footer-place"></h4>
          <button
            aria-label="Me gusta"
            class="gallery__footer-btn"
            type="button"
          ></button>
        </div>
      </div>
    </template>

    <!-- Único script modular principal -->
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
